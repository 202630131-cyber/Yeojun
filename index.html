<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? 🍰 간식 추천기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Gowun Dodum', sans-serif;
            background: linear-gradient(135deg, #FFF5E4 0%, #FFE3E1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4A3E3D;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(235, 130, 120, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 3px solid #FFF0F0;
        }

        h1 {
            font-family: 'Jua', sans-serif;
            font-size: 2rem;
            color: #FF6B6B;
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px #FFD2D2;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #887875;
            margin-bottom: 25px;
        }

        .display-card {
            background: #FFF9F9;
            border: 2px dashed #FFB4B4;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 25px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .emoji {
            font-size: 5rem;
            line-height: 1.2;
            margin-bottom: 10px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.08));
            transition: transform 0.2s ease;
        }

        .food-name {
            font-family: 'Jua', sans-serif;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 6px;
        }

        .food-desc {
            font-size: 0.9rem;
            color: #776663;
            word-break: keep-all;
        }

        .btn {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
            color: white;
            font-size: 1.25rem;
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(255, 107, 107, 0.5);
            background: linear-gradient(135deg, #FF5252 0%, #FF7676 100%);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        /* Animation class */
        .bounce {
            animation: bounce 0.4s ease;
        }

        @keyframes bounce {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>오늘의 간식 추천 🍰</h1>
        <p class="subtitle">출출할 때 클릭 한번으로 간식을 골라보세요!</p>

        <div class="display-card" id="card">
            <div class="emoji" id="emoji">❓</div>
            <div class="food-name" id="foodName">무엇을 먹을까요?</div>
            <div class="food-desc" id="foodDesc">아래 버튼을 눌러 오늘 먹을 간식을 뽑아보세요!</div>
        </div>

        <button class="btn" onclick="recommendSnack()">오늘 간식 추천! ✨</button>
    </div>

    <script>
        const snacks = [
            { name: "떡볶이", emoji: "🍡", desc: "매콤달콤 국민 간식! 튀김이랑 김밥도 같이?" },
            { name: "붕어빵", emoji: "🐟", desc: "팥붕 vs 슈붕! 당신의 선택은?" },
            { name: "조각 케이크", emoji: "🍰", desc: "달콤한 케이크 한 조각으로 기분 전환!" },
            { name: "도넛", emoji: "🍩", desc: "커피와 환상의 짝꿍, 푹신하고 달콤한 도넛" },
            { name: "피자", emoji: "🍕", desc: "치즈가 쭉~ 늘어나는 맛있는 피자 한 조각" },
            { name: "햄버거", emoji: "🍔", desc: "출출함을 한 번에 해결해 줄 든든한 버거" },
            { name: "감자튀김", emoji: "🍟", desc: "바삭바삭 짭조름한 자꾸 끌리는 맛" },
            { name: "아이스크림", emoji: "🍦", desc: "시원하고 달콤하게 오늘 하루 마무리" },
            { name: "초콜릿", emoji: "🍫", desc: "당 충전이 필요할 땐 역시 달콤한 초콜릿" },
            { name: "쿠키", emoji: "🍪", desc: "바삭하고 고소한 수제 쿠키 한 입" },
            { name: "팝콘", emoji: "🍿", desc: "영화 볼 때 필수, 손이 가요 손이 가~" },
            { name: "핫도그", emoji: "🌭", desc: "설탕과 케첩 듬뿍 바른 바삭한 핫도그" },
            { name: "만두", emoji: "🥟", desc: "갓 쪄낸 따끈따끈하고 속이 알찬 만두" },
            { name: "와플", emoji: "🧇", desc: "생크림과 사과잼이 듬뿍 들어간 겉바속촉 와플" },
            { name: "타코야끼", emoji: "🐙", desc: "가쓰오부시가 춤추는 겉바속촉 타코야끼" },
            { name: "포테이토 칩", emoji: "🥔", desc: "바삭함의 끝판왕! 짭짤한 감자칩" },
            { name: "버블티", emoji: "🧋", desc: "쫄깃한 펄이 씹히는 달콤한 밀크티" },
            { name: "과일 샐러드", emoji: "🍓", desc: "상큼함이 터지는 건강한 과일 타임" }
        ];

        function recommendSnack() {
            const card = document.getElementById('card');
            const emojiEl = document.getElementById('emoji');
            const nameEl = document.getElementById('foodName');
            const descEl = document.getElementById('foodDesc');

            let count = 0;
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * snacks.length);
                emojiEl.textContent = snacks[tempIndex].emoji;
                nameEl.textContent = snacks[tempIndex].name;
                count++;

                if (count > 10) {
                    clearInterval(interval);
                    const finalIndex = Math.floor(Math.random() * snacks.length);
                    const selected = snacks[finalIndex];

                    emojiEl.textContent = selected.emoji;
                    nameEl.textContent = selected.name;
                    descEl.textContent = selected.desc;

                    emojiEl.classList.remove('bounce');
                    void emojiEl.offsetWidth;
                    emojiEl.classList.add('bounce');
                }
            }, 60);
        }
    </script>
</body>
</html>
